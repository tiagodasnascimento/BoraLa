version: '3.9'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      MIX_ENV: dev
      PORT: 4000
    volumes:
      - ./backend:/app
    working_dir: /app
    command: sh -c "mix deps.get && mix phx.server"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bora_la_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
